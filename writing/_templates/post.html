<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
$if(description)$  <meta name="description" content="$description$">
$endif$  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-title" content="xufilps">
  <link rel="icon" href="../../assets/site-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png" sizes="180x180">
  <title>$title$ · xufilps</title>
  <link rel="stylesheet" href="../../styles.css">
  <script src="../../theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至正文</a>
  <div class="site-shell" id="top">
    <header class="site-header">
      <a class="brand" href="../../">Home · xufilps</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="../../">首页</a>
        <a href="../" aria-current="page">文章</a>
        <a href="../../projects/">项目</a>
        <a href="../../about/">关于</a>
      </nav>
      <a class="github-nav" href="https://github.com/xufilps" target="_blank" rel="noopener noreferrer" aria-label="xufilps 的 GitHub 主页">GitHub ↗</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换至深色模式" aria-pressed="false" hidden>◐ 深色</button>
    </header>
    <main id="main" class="article-page">
      <header class="page-intro article-intro">
        <p class="eyebrow">思考记录$if(category)$ / $category$$endif$</p>
        <h1>$title$</h1>
$if(date)$        <p class="article-meta"><time datetime="$date$">$date$</time></p>
$endif$      </header>
      <article class="article-body">
$if(toc)$
        <details class="project-toc">
          <summary>文章目录</summary>
          <nav aria-label="文章目录">
$toc$
          </nav>
        </details>
$endif$
$body$
      </article>
      <a class="article-back" href="../">← 返回文章目录</a>
    </main>
    <footer class="site-footer"><span>© 2026 xufilps · 作品与思考</span><a href="#top">返回顶部 ↑</a></footer>
  </div>
</body>
</html>
